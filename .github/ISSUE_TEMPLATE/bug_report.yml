name: Bug report
description: A wrong diagnostic, a wrong fix, or a crash
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A Compose file that reproduces the problem is the one thing that cannot
        be guessed. Everything else can be worked out from it.

  - type: textarea
    id: compose
    attributes:
      label: Compose file
      description: The smallest file that still shows the problem.
      render: yaml
      placeholder: |
        name: example
        services:
          web:
            image: nginx:1.27
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: What you ran and what composelint printed.
      render: shell
      placeholder: |
        $ composelint compose.yaml
        compose.yaml
          4:12  warn  ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your `.composelintrc.json` or equivalent, if you use one.
      render: json

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `composelint --version` and `node --version`.
      placeholder: composelint 0.1.0, node v22.20.0
    validations:
      required: true
