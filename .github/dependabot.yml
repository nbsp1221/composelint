version: 2
updates:
  # Actions are referenced by major tag, so this catches the majors moving.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    groups:
      dev-dependencies:
        dependency-type: development
