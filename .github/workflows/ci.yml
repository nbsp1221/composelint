name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow needs write access.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm typecheck

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The two active LTS lines plus current, matching `engines.node`.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The end-to-end tests run the built CLI, so they come after the build.
      - run: pnpm test
      - run: pnpm test:e2e

  package:
    name: Verify the published package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Install the tarball the way a user would, then run the installed binary.
      # This catches a missing file in `files`, a broken `bin` entry, or a
      # dependency that only resolves inside the repository.
      - run: |
          pnpm pack --pack-destination /tmp
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y > /dev/null
          npm install /tmp/composelint-*.tgz
          printf 'name: smoke\nservices:\n  web:\n    image: nginx\n' > compose.yaml
          ./node_modules/.bin/composelint --format json
          ./node_modules/.bin/composelint --version
